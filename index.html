<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="萌宠连连看">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a0a2e">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>萌宠连连看</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{-webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:manipulation}
:root{
  --bg1:#1a0a2e;--bg2:#16213e;--accent:#e94560;--gold:#ffd700;
  --text:#f5e6ff;--muted:#a89bb8;--panel:rgba(26,10,46,.92);
  --sel:#3b82f6;--hint:#ef4444;--line:#22c55e;--tile:#f7f0e6;
}
html,body{height:100%;width:100%;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,#0f1c3f);color:var(--text);touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  position:fixed;inset:0;user-select:none;-webkit-user-select:none}
#orientRoot{width:100%;height:100%;position:relative;overflow:hidden}
#app{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;
  padding:max(4px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(4px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
  gap:4px;position:relative;overflow:hidden}
/* Portrait fallback: rotate whole game into landscape */
body.force-landscape #orientRoot{
  position:fixed; width:100vh; height:100vw; top:0; left:100%;
  transform:rotate(90deg); transform-origin:top left;
  overflow:hidden;
}
body.force-landscape #app{
  width:100%; height:100%;
  padding:max(4px, env(safe-area-inset-left)) max(6px, env(safe-area-inset-top)) max(4px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom));
}
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:960px;gap:14px;z-index:2}
.screen.active{display:flex}
h1{font-size:clamp(1.6rem,5vw,2.4rem);background:linear-gradient(90deg,#ff9a9e,#fecfef,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800;letter-spacing:.08em}
.sub{color:var(--muted);font-size:.9rem;margin-top:-6px}
.btn{border:none;border-radius:12px;padding:10px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.04em;
  box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .1s,filter .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn-primary{background:linear-gradient(180deg,#ff6b9d,#e94560);color:#fff}
.btn-sec{background:linear-gradient(180deg,#4a90d9,#2563eb);color:#fff;padding:6px 12px;font-size:.85rem;border-radius:8px}
.btn-ghost{background:rgba(255,255,255,.12);color:var(--text);border:1px solid rgba(255,255,255,.2);box-shadow:none;padding:6px 12px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.pets-preview{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:420px;margin:4px 0}
.pets-preview .mini{width:34px;height:34px;border-radius:7px;overflow:hidden;background:var(--tile);border:1px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center}
.pets-preview .mini img{width:92%;height:92%;object-fit:cover;border-radius:5px}
#gameScreen{height:100%;justify-content:flex-start;padding-top:2px;max-width:100%}
.hud{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;width:100%;max-width:920px;padding:6px 10px;background:var(--panel);
  border-radius:10px;border:1px solid rgba(255,255,255,.08);font-size:.82rem;overflow-x:auto}
.hud .tag{background:rgba(233,69,96,.35);border:1px solid rgba(255,182,193,.4);border-radius:6px;padding:2px 8px;white-space:nowrap}
.hud .stat{white-space:nowrap}
.hud .stat b{color:var(--gold)}
.hud .spacer{flex:1;min-width:8px}
.hud .score{color:var(--gold);font-weight:800;font-size:1rem;white-space:nowrap}
.timer-wrap{width:100%;max-width:920px;height:10px;background:#3a2a5a;border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.timer-bar{height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444);border-radius:6px;transition:width .15s linear}
.board-wrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;width:100%;max-width:920px;min-height:0}
#board{display:grid;gap:2px;padding:3px;background:rgba(0,0,0,.28);border-radius:10px;border:2px solid rgba(255,182,193,.22);position:relative;touch-action:none}
.tile{aspect-ratio:1;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;
  background:linear-gradient(145deg,#f7f0e6,#e8dfd2);border:2px solid rgba(255,255,255,.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 3px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
.tile.empty{visibility:hidden;pointer-events:none;border:none;background:transparent;box-shadow:none}
.tile.selected{border-color:var(--sel);box-shadow:0 0 0 3px rgba(59,130,246,.55),0 0 12px rgba(59,130,246,.4);transform:scale(1.04);z-index:2}
.tile.hint{border-color:var(--hint);box-shadow:0 0 0 3px rgba(239,68,68,.55),0 0 12px rgba(239,68,68,.4);animation:pulse .55s ease infinite}
.tile img{width:90%;height:90%;object-fit:cover;border-radius:4px;pointer-events:none;display:block}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#linkCanvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:5}
.toast{position:absolute;top:20%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:8px 16px;
  border-radius:10px;font-size:.95rem;opacity:0;pointer-events:none;z-index:16;transition:opacity .2s}
.toast.show{opacity:1}
.overlay{position:absolute;inset:0;background:rgba(10,5,25,.78);display:flex;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(4px)}
.overlay.hidden{display:none}
.card{background:linear-gradient(160deg,#2a1a4a,#1a0a2e);border:2px solid rgba(255,182,193,.35);border-radius:18px;padding:26px 30px;
  text-align:center;max-width:90vw;box-shadow:0 12px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:12px;align-items:center}
.card h2{font-size:1.5rem;color:var(--gold)}
.card p{color:var(--muted);line-height:1.5;white-space:pre-line}
.bg-deco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;opacity:.12}
.bg-deco span{position:absolute;font-size:1.8rem;animation:float 14s linear infinite}
@keyframes float{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-10vh) rotate(360deg)}}
#pauseCover{position:absolute;inset:0;background:rgba(10,5,25,.85);z-index:12;display:none;align-items:center;justify-content:center;border-radius:10px}
#pauseCover.show{display:flex}
.hud{flex-wrap:wrap;row-gap:4px}
#board,.tile,img{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tile{touch-action:manipulation}
@media(max-height:420px),(max-width:740px){
  .hud{font-size:.68rem;gap:4px 6px;padding:3px 6px}
  .btn-sec,.btn-ghost{padding:4px 8px;font-size:.72rem;min-height:28px}
  .timer-wrap{height:8px}
  h1{font-size:1.4rem}
  .screen{gap:8px}
}
@media(max-height:360px){
  .hud{font-size:.62rem;padding:2px 4px}
  .pets-preview .mini{width:28px;height:28px}
}
</style>
</head>
<body>
<div id="orientRoot">
<div class="bg-deco" id="bgDeco"></div>
<div id="app">
  <div class="screen active" id="startScreen">
    <h1>🐾 萌宠连连看</h1>
    <p class="sub">连接相同的小动物，清空棋盘吧！</p>
    <div class="pets-preview" id="previewPets"></div>
    <p style="color:var(--muted);font-size:.8rem;max-width:360px;text-align:center;line-height:1.55">点击两只相同的萌宠，若可用不超过两次转弯的路径相连即可消除。共九关，越玩越有趣！</p>
    <button class="btn btn-primary" id="btnStart">开始游戏</button>
    <p style="color:var(--muted);font-size:.75rem">最高分：<b id="bestScoreDisp">0</b></p>
  </div>

  <div class="screen" id="gameScreen">
    <div class="hud">
      <span class="stat">第<b id="levelDisp">1</b>关</span>
      <span class="tag" id="levelName">新手试玩</span>
      <span class="stat"><b id="livesDisp">5</b>点生命</span>
      <span class="stat"><b id="hintDisp">3</b>次提示</span>
      <button class="btn btn-sec" id="btnHint">提示</button>
      <button class="btn btn-sec" id="btnShuffle">重排</button>
      <button class="btn btn-ghost" id="btnPause">暂停</button>
      <button class="btn btn-ghost" id="btnMute">🔊</button>
      <span class="spacer"></span>
      <span class="score" id="scoreDisp">0</span>
    </div>
    <div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div>
    <div class="board-wrap">
      <div id="board"></div>
      <canvas id="linkCanvas"></canvas>
      <div id="pauseCover"><div class="card" style="padding:18px 24px"><h2>已暂停</h2>
        <button class="btn btn-primary" id="btnResume">继续游戏</button>
        <button class="btn btn-ghost" id="btnToStart">返回标题</button>
      </div></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>

  <div class="overlay hidden" id="endOverlay">
    <div class="card">
      <h2 id="endTitle">游戏结束</h2>
      <p id="endMsg"></p>
      <button class="btn btn-primary" id="btnEndAction">从头再来</button>
    </div>
  </div>
</div>
</div>

function ensureAudio(){

/* ========== Board gen ========== */
function buildBoard(types){
  const total = COLS * ROWS; // 140
  const pairs = total / 2; // 70
  const tiles = [];
  for(let i=0;i<pairs;i++){
    const t = i % types;
    tiles.push(t, t);
  }
  for(let i=tiles.length-1;i>0;i--){
    const j = (Math.random()*(i+1))|0;
    [tiles[i],tiles[j]]=[tiles[j],tiles[i]];
  }
  const board=[];
  let idx=0;
  for(let r=0;r<ROWS;r++){
    board[r]=[];
    for(let c=0;c<COLS;c++) board[r][c]=tiles[idx++];
  }
  return board;
}

function shuffleRemaining(){
  const vals=[];
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++)
    if(state.board[r][c]>=0) vals.push(state.board[r][c]);
  for(let i=vals.length-1;i>0;i--){
    const j=(Math.random()*(i+1))|0;
    [vals[i],vals[j]]=[vals[j],vals[i]];
  }
  let i=0;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++)
    if(state.board[r][c]>=0) state.board[r][c]=vals[i++];
}

function countTiles(){
  let n=0;
  const rows=state.board.length, cols=state.board[0]?state.board[0].length:0;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(state.board[r][c]>=0) n++;
  return n;
}

/* ========== Path finding (≤2 turns, border ring) ========== */
function canConnect(r1,c1,r2,c2){
  if(r1===r2 && c1===c2) return null;
  const rows=state.board.length, cols=state.board[0].length;
  if(r1<0||c1<0||r2<0||c2<0||r1>=rows||c1>=cols||r2>=rows||c2>=cols) return null;
  if(state.board[r1][c1]<0 || state.board[r2][c2]<0) return null;
  if(state.board[r1][c1] !== state.board[r2][c2]) return null;
  const R=rows+2, C=cols+2;
  function isEmpty(vr,vc){
    if(vr<0||vc<0||vr>=R||vc>=C) return false;
    if(vr===0||vc===0||vr===R-1||vc===C-1) return true;
    const tr=vr-1, tc=vc-1;
    if((tr===r1&&tc===c1)||(tr===r2&&tc===c2)) return true;
    return state.board[tr][tc]<0;
  }
  const sr=r1+1, sc=c1+1, er=r2+1, ec=c2+1;
  if(clearLine(sr,sc,er,ec,isEmpty)) return [[r1,c1],[r2,c2]];
  for(let vr=0;vr<R;vr++) for(let vc=0;vc<C;vc++){
    if(!isEmpty(vr,vc)) continue;
    if((vr===sr&&vc===sc)||(vr===er&&vc===ec)) continue;
    if(!(vr===sr||vc===sc) || !(vr===er||vc===ec)) continue;
    if((vr===sr&&vr===er)||(vc===sc&&vc===ec)) continue;
    if(clearLine(sr,sc,vr,vc,isEmpty)&&clearLine(vr,vc,er,ec,isEmpty))
      return [[r1,c1],[vr-1,vc-1],[r2,c2]];
  }
  const fromStart=lineReachable(sr,sc,isEmpty,R,C);
  const fromEnd=lineReachable(er,ec,isEmpty,R,C);
  for(const [ar,ac] of fromStart){
    if(ar===sr&&ac===sc) continue;
    for(const [br,bc] of fromEnd){
      if(br===er&&bc===ec) continue;
      if(ar===br&&ac===bc) continue;
      if((ar===br||ac===bc)&&clearLine(ar,ac,br,bc,isEmpty)){
        const d1=dir(sr,sc,ar,ac), d2=dir(ar,ac,br,bc), d3=dir(br,bc,er,ec);
        if(d1&&d2&&d3&&d1!==d2&&d2!==d3)
          return [[r1,c1],[ar-1,ac-1],[br-1,bc-1],[r2,c2]];
      }
    }
  }
  return null;
}
function dir(r1,c1,r2,c2){
  if(r1===r2&&c1!==c2) return c2>c1?'E':'W';
  if(c1===c2&&r1!==r2) return r2>r1?'S':'N';
  return null;
}
function clearLine(r1,c1,r2,c2,isEmpty){
  if(r1!==r2&&c1!==c2) return false;
  if(r1===r2){
    const step=c2>c1?1:-1;
    for(let c=c1+step;c!==c2;c+=step) if(!isEmpty(r1,c)) return false;
    return true;
  }
  const step=r2>r1?1:-1;
  for(let r=r1+step;r!==r2;r+=step) if(!isEmpty(r,c1)) return false;
  return true;
}
function lineReachable(sr,sc,isEmpty,R,C){
  const out=[[sr,sc]];
  for(const [dr,dc] of [[0,1],[0,-1],[1,0],[-1,0]]){
    let r=sr+dr,c=sc+dc;
    while(r>=0&&c>=0&&r<R&&c<C&&isEmpty(r,c)){ out.push([r,c]); r+=dr; c+=dc; }
  }
  return out;
}
function findAnyMove(){
  const rows=state.board.length, cols=state.board[0].length;
  const cells=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++)
    if(state.board[r][c]>=0) cells.push([r,c]);
  for(let i=0;i<cells.length;i++){
    for(let j=i+1;j<cells.length;j++){
      const [r1,c1]=cells[i],[r2,c2]=cells[j];
      if(state.board[r1][c1]!==state.board[r2][c2]) continue;
      const path=canConnect(r1,c1,r2,c2);
      if(path) return {a:[r1,c1],b:[r2,c2],path};
    }
  }
  return null;
}

/* ========== Gravity ========== */
function applyGravity(mode, board){
  const b = board || state.board;
  const R=b.length, C=b[0].length;
  if(!mode) return b;
  if(mode==='down'){
    for(let c=0;c<C;c++){
      let w=R-1;
      for(let r=R-1;r>=0;r--){ if(b[r][c]>=0){ if(w!==r){b[w][c]=b[r][c];b[r][c]=-1;} w--; } }
    }
  } else if(mode==='up'){
    for(let c=0;c<C;c++){
      let w=0;
      for(let r=0;r<R;r++){ if(b[r][c]>=0){ if(w!==r){b[w][c]=b[r][c];b[r][c]=-1;} w++; } }
    }
  } else if(mode==='left'){
    for(let r=0;r<R;r++){
      let w=0;
      for(let c=0;c<C;c++){ if(b[r][c]>=0){ if(w!==c){b[r][w]=b[r][c];b[r][c]=-1;} w++; } }
    }
  } else if(mode==='right'){
    for(let r=0;r<R;r++){
      let w=C-1;
      for(let c=C-1;c>=0;c--){ if(b[r][c]>=0){ if(w!==c){b[r][w]=b[r][c];b[r][c]=-1;} w--; } }
    }
  } else if(mode==='splitUD'){
    // top half up, bottom half down
    const mid=Math.floor(R/2);
    for(let c=0;c<C;c++){
      const top=[];
      for(let r=0;r<mid;r++) if(b[r][c]>=0) top.push(b[r][c]);
      for(let r=0;r<mid;r++) b[r][c]=-1;
      for(let i=0;i<top.length;i++) b[i][c]=top[i];
      const bot=[];
      for(let r=mid;r<R;r++) if(b[r][c]>=0) bot.push(b[r][c]);
      for(let r=mid;r<R;r++) b[r][c]=-1;
      for(let i=0;i<bot.length;i++) b[R-bot.length+i][c]=bot[i];
    }
  } else if(mode==='splitLR'){
    const mid=Math.floor(C/2);
    for(let r=0;r<R;r++){
      const left=[];
      for(let c=0;c<mid;c++) if(b[r][c]>=0) left.push(b[r][c]);
      for(let c=0;c<mid;c++) b[r][c]=-1;
      for(let i=0;i<left.length;i++) b[r][i]=left[i];
      const right=[];
      for(let c=mid;c<C;c++) if(b[r][c]>=0) right.push(b[r][c]);
      for(let c=mid;c<C;c++) b[r][c]=-1;
      for(let i=0;i<right.length;i++) b[r][C-right.length+i]=right[i];
    }
  } else if(mode==='centerH'){
    // toward vertical center: left half pack right, right half pack left
    const mid=Math.floor(C/2);
    for(let r=0;r<R;r++){
      const left=[];
      for(let c=0;c<mid;c++) if(b[r][c]>=0) left.push(b[r][c]);
      for(let c=0;c<mid;c++) b[r][c]=-1;
      for(let i=0;i<left.length;i++) b[r][mid-left.length+i]=left[i];
      const right=[];
      for(let c=mid;c<C;c++) if(b[r][c]>=0) right.push(b[r][c]);
      for(let c=mid;c<C;c++) b[r][c]=-1;
      for(let i=0;i<right.length;i++) b[r][mid+i]=right[i];
    }
  }
  return b;
}

/* ========== Render ========== */
function renderBoard(){
  const boardEl=$('board');
  boardEl.style.gridTemplateColumns=`repeat(${COLS},1fr)`;
  boardEl.innerHTML='';
  const wrap=boardEl.parentElement.getBoundingClientRect();
  const maxW=Math.max(120, wrap.width-4);
  const maxH=Math.max(100, wrap.height-4);
  const gap=Math.max(1, Math.min(2, Math.floor(Math.min(maxW,maxH)/200)));
  const cellW=Math.floor((maxW-gap*(COLS-1)-4)/COLS);
  const cellH=Math.floor((maxH-gap*(ROWS-1)-4)/ROWS);
  const size=Math.max(16, Math.min(cellW, cellH, 64));
  boardEl.style.gap=gap+'px';
  boardEl.style.width=(size*COLS+gap*(COLS-1)+6)+'px';
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const t=state.board[r][c];
      const div=document.createElement('div');
      div.className='tile'+(t<0?' empty':'');
      div.style.width=size+'px'; div.style.height=size+'px';
      div.dataset.r=r; div.dataset.c=c;
      if(t>=0){
        div.innerHTML=petIconHtml(t);
        div.style.background=TILE_BG;
        div.addEventListener('pointerup', function(e){
          if(e.pointerType==='mouse' && e.button!==0) return;
          e.preventDefault();
          onTileClick.call(this,e);
        });
      }
      boardEl.appendChild(div);
    }
  }
  syncCanvas();
  updateSelUI();
}
function syncCanvas(){
  const boardEl=$('board'), canvas=$('linkCanvas'), wrap=boardEl.parentElement;
  canvas.width=wrap.clientWidth; canvas.height=wrap.clientHeight;
  canvas.style.width=wrap.clientWidth+'px'; canvas.style.height=wrap.clientHeight+'px';
}
function tileCenter(r,c){
  const boardEl=$('board');
  const el=boardEl.querySelector(`[data-r="${r}"][data-c="${c}"]`);
  if(!el) return null;
  const wrap=boardEl.parentElement.getBoundingClientRect();
  const er=el.getBoundingClientRect();
  return {x:er.left-wrap.left+er.width/2, y:er.top-wrap.top+er.height/2};
}
function drawPath(path){
  const canvas=$('linkCanvas');
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!path||path.length<2) return;
  const pts=[];
  for(const [r,c] of path){
    if(r<0||c<0||r>=ROWS||c>=COLS){
      const rr=Math.max(0,Math.min(ROWS-1,r));
      const cc=Math.max(0,Math.min(COLS-1,c));
      const base=tileCenter(rr,cc);
      if(!base) continue;
      const el=$('board').querySelector(`[data-r="${rr}"][data-c="${cc}"]`);
      const sz=el?el.offsetWidth:36;
      pts.push({
        x:base.x+(c<0?-sz:c>=COLS?sz:0),
        y:base.y+(r<0?-sz:r>=ROWS?sz:0)
      });
    } else {
      const p=tileCenter(r,c); if(p) pts.push(p);
    }
  }
  if(pts.length<2) return;
  ctx.strokeStyle='#22c55e';
  ctx.lineWidth=3.5;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.shadowColor='rgba(34,197,94,.85)'; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
  ctx.stroke();
}
function clearPath(){ const c=$('linkCanvas'); c.getContext('2d').clearRect(0,0,c.width,c.height); }
function updateSelUI(){
  document.querySelectorAll('.tile.selected').forEach(e=>e.classList.remove('selected'));
  if(state.selected){
    const el=$('board').querySelector(`[data-r="${state.selected[0]}"][data-c="${state.selected[1]}"]`);
    if(el) el.classList.add('selected');
  }
}
function updateHUD(){
  const lv=LEVELS[state.level];
  $('levelDisp').textContent=state.level+1;
  $('levelName').textContent=lv.name;
  $('livesDisp').textContent=state.lives;
  $('hintDisp').textContent=state.hints;
  $('scoreDisp').textContent=state.score;
  $('btnHint').disabled=state.hints<=0||!state.running||state.paused;
  $('btnShuffle').disabled=state.lives<=0||!state.running||state.paused;
  const pct=state.timeMax>0?(state.timeLeft/state.timeMax)*100:0;
  $('timerBar').style.width=Math.max(0,pct)+'%';
}
function showToast(msg, ms){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), ms||1200);
}

/* ========== Interaction ========== */
function onTileClick(){
  if(!state.running||state.paused||state.animating) return;
  const r=+this.dataset.r, c=+this.dataset.c;
  if(state.board[r][c]<0) return;
  if(!state.selected){
    state.selected=[r,c]; updateSelUI(); sfxSelect(); return;
  }
  const [sr,sc]=state.selected;
  if(sr===r&&sc===c){ state.selected=null; updateSelUI(); return; }
  if(state.board[sr][sc]!==state.board[r][c]){
    state.selected=[r,c]; updateSelUI(); sfxSelect(); return;
  }
  const path=canConnect(sr,sc,r,c);
  if(!path){
    state.selected=[r,c]; updateSelUI(); sfxFail(); return;
  }
  state.animating=true;
  drawPath(path);
  sfxMatch();
  state.score += MATCH_SCORE;
  const refill = state.level < 2 ? MATCH_TIME_BONUS_EARLY : MATCH_TIME_BONUS_LATE;
  state.timeLeft = Math.min(state.timeMax, state.timeLeft + refill);
  // vanish immediately visually
  const el1=$('board').querySelector(`[data-r="${sr}"][data-c="${sc}"]`);
  const el2=$('board').querySelector(`[data-r="${r}"][data-c="${c}"]`);
  if(el1){ el1.classList.add('empty'); el1.innerHTML=''; }
  if(el2){ el2.classList.add('empty'); el2.innerHTML=''; }
  state.board[sr][sc]=-1; state.board[r][c]=-1;
  state.selected=null;
  setTimeout(()=>{
    clearPath();
    applyGravity(LEVELS[state.level].gravity);
    renderBoard();
    state.animating=false;
    updateHUD();
    if(countTiles()===0){ levelClear(); return; }
    ensureMovesOrGameOver();
  }, 180);
}

function ensureMovesOrGameOver(){
  if(findAnyMove()) return;
  if(countTiles()===0) return;
  if(state.lives>0){
    state.lives--;
    shuffleRemaining();
    // keep shuffling until a move exists or give up after many tries
    let g=0;
    while(!findAnyMove() && countTiles()>0 && g<60){ shuffleRemaining(); g++; }
    renderBoard();
    updateHUD();
    showToast('无解，消耗1点生命重排');
    sfxShuffle();
    if(!findAnyMove() && state.lives<=0){ gameOver(); }
    else if(!findAnyMove() && state.lives>0){
      // recursive spend if still no move
      ensureMovesOrGameOver();
    }
  } else {
    gameOver();
  }
}

function levelClear(){
  state.running=false; stopTimer();
  const timeBonus = Math.floor(state.timeLeft * TIME_BONUS_RATE);
  const lvlBonus = LEVEL_CLEAR_BONUS;
  state.score += timeBonus + lvlBonus;
  if(state.score>getBest()) setBest(state.score);
  updateHUD();
  sfxWin();
  const isLast = state.level >= LEVELS.length-1;
  if(isLast){
    $('endTitle').textContent='恭喜通关！';
    $('endMsg').textContent=`全部九关完成！\n时间奖励 +${timeBonus}，关卡奖励 +${lvlBonus}\n最终得分 ${state.score}\n最高分 ${getBest()}`;
    $('btnEndAction').textContent='从头再来';
    $('btnEndAction').dataset.action='restart';
  } else {
    $('endTitle').textContent='恭喜,过关';
    $('endMsg').textContent=`第 ${state.level+1} 关「${LEVELS[state.level].name}」完成！\n时间奖励 +${timeBonus}，关卡奖励 +${lvlBonus}\n当前得分 ${state.score}\n点击任意处进入下一关`;
    $('btnEndAction').textContent='下一关';
    $('btnEndAction').dataset.action='next';
  }
  $('endOverlay').classList.remove('hidden');
}

function gameOver(){
  state.running=false; stopTimer();
  if(state.score>getBest()) setBest(state.score);
  sfxLose();
  $('endTitle').textContent='游戏结束';
  $('endMsg').textContent=`得分 ${state.score}\n最高分 ${getBest()}`;
  $('btnEndAction').textContent='从头再来';
  $('btnEndAction').dataset.action='restart';
  $('endOverlay').classList.remove('hidden');
}

function startLevel(idx){
  state.level=idx;
  const cfg=LEVELS[idx];
  // Cap types by available icons
  const types=Math.min(cfg.types, PET_ICONS.length);
  state.board=buildBoard(types);
  state.selected=null;
  // Carry-over: L1 starts at HINTS_START/LIVES_START; later levels leftover + bonus
  if(idx===0){
    state.hints = HINTS_START;
    state.lives = LIVES_START;
  } else {
    state.hints = Math.min(HINTS_CAP, (state.hints||0) + HINTS_PER_LEVEL);
    state.lives = (state.lives||0) + LIVES_PER_LEVEL;
  }
  state.timeMax=cfg.time;
  state.timeLeft=cfg.time;
  state.running=true; state.paused=false; state.animating=false;
  $('endOverlay').classList.add('hidden');
  $('pauseCover').classList.remove('show');
  showScreen('gameScreen');
  // Ensure opening board has a move
  let g=0;
  while(!findAnyMove() && g<40){ state.board=buildBoard(types); g++; }
  renderBoard();
  updateHUD();
  startTimer();
}
function isTouchDevice(){
  try{
    return ('ontouchstart' in window)
      || (navigator.maxTouchPoints||0)>0
      || matchMedia('(pointer:coarse)').matches
      || /Android|iPhone|iPad|iPod|Mobile|Touch/i.test(navigator.userAgent||'');
  }catch(e){ return true; }
}
function updateForceLandscape(){
  // CSS rotate fallback when portrait on phone-like viewport and lock unavailable
  const portrait = window.innerHeight > window.innerWidth;
  const phoneLike = isTouchDevice() || Math.min(window.innerWidth, window.innerHeight) <= 500;
  const need = portrait && phoneLike && !state._lockedLandscape;
  document.body.classList.toggle('force-landscape', !!need);
  requestAnimationFrame(()=>{ if($('gameScreen')&&$('gameScreen').classList.contains('active')) renderBoard(); });
}
async function enterLandscapeMode(){
  state._lockedLandscape=false;
  try{
    const el = document.documentElement;
    if(el.requestFullscreen) await el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }catch(e){}
  try{
    if(screen.orientation && screen.orientation.lock){
      await screen.orientation.lock('landscape');
      // Only trust lock if viewport is actually landscape now
      await new Promise(r=>setTimeout(r,50));
      if(window.innerWidth >= window.innerHeight) state._lockedLandscape=true;
    }
  }catch(e){ state._lockedLandscape=false; }
  updateForceLandscape();
}
function startGame(){
  ensureAudio();
  enterLandscapeMode();
  state.score=0;
  state.hints=0;
  state.lives=0;
  startLevel(0);
}
function startTimer(){
  stopTimer();
  state.timerId=setInterval(()=>{
    if(!state.running||state.paused) return;
    state.timeLeft-=0.2;
    if(state.timeLeft<=0){ state.timeLeft=0; updateHUD(); gameOver(); return; }
    updateHUD();
  },200);
}
function stopTimer(){ if(state.timerId){ clearInterval(state.timerId); state.timerId=null; } }
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
}

/* ========== Buttons ========== */
$('btnStart').onclick=startGame;
$('btnEndAction').onclick=()=>{
  const act=$('btnEndAction').dataset.action;
  $('endOverlay').classList.add('hidden');
  if(act==='next') startLevel(state.level+1);
  else { stopTimer(); state.running=false; $('bestScoreDisp').textContent=getBest(); showScreen('startScreen'); }
};
// Click overlay card area also advances on clear
$('endOverlay').addEventListener('click', (e)=>{
  if(e.target.closest('button')) return;
  if($('btnEndAction').dataset.action==='next'){
    $('endOverlay').classList.add('hidden');
    startLevel(state.level+1);
  }
});
$('btnPause').onclick=()=>{
  if(!state.running) return;
  state.paused=true;
  $('pauseCover').classList.add('show');
};
$('btnResume').onclick=()=>{
  state.paused=false;
  $('pauseCover').classList.remove('show');
};
$('btnToStart').onclick=()=>{
  stopTimer(); state.running=false; state.paused=false;
  $('pauseCover').classList.remove('show');
  $('bestScoreDisp').textContent=getBest();
  showScreen('startScreen');
};
$('btnMute').onclick=()=>{
  state.muted=!state.muted;
  $('btnMute').textContent=state.muted?'🔇':'🔊';
};
$('btnHint').onclick=()=>{
  if(state.hints<=0||!state.running||state.paused) return;
  const m=findAnyMove();
  if(!m){ ensureMovesOrGameOver(); return; }
  state.hints--; updateHUD(); sfxHint();
  document.querySelectorAll('.tile.hint').forEach(e=>e.classList.remove('hint'));
  const e1=$('board').querySelector(`[data-r="${m.a[0]}"][data-c="${m.a[1]}"]`);
  const e2=$('board').querySelector(`[data-r="${m.b[0]}"][data-c="${m.b[1]}"]`);
  if(e1) e1.classList.add('hint');
  if(e2) e2.classList.add('hint');
  setTimeout(()=>{ if(e1) e1.classList.remove('hint'); if(e2) e2.classList.remove('hint'); },1600);
};
$('btnShuffle').onclick=()=>{
  if(state.lives<=0||!state.running||state.paused) return;
  state.lives--;
  state.selected=null;
  shuffleRemaining();
  let g=0;
  while(!findAnyMove() && countTiles()>0 && g<50){ shuffleRemaining(); g++; }
  renderBoard(); updateHUD(); sfxShuffle();
  showToast('重排（消耗1点生命）');
};

function onViewportChange(){
  updateForceLandscape();
  if($('gameScreen').classList.contains('active')) renderBoard();
}
window.addEventListener('resize', onViewportChange);
window.addEventListener('orientationchange', ()=> setTimeout(onViewportChange, 120));
document.addEventListener('fullscreenchange', onViewportChange);
if(screen.orientation) screen.orientation.addEventListener('change', ()=> setTimeout(onViewportChange, 80));
// Prevent double-tap zoom on board
document.addEventListener('gesturestart', e=>e.preventDefault());
let lastTouchEnd=0;
document.addEventListener('touchend', function(e){
  const now=Date.now();
  if(now-lastTouchEnd<=300) e.preventDefault();
  lastTouchEnd=now;
}, {passive:false});

(function init(){
  const box=$('previewPets');
  for(let i=0;i<18;i++){
    const d=document.createElement('div');
    d.className='mini'; d.innerHTML=petIconHtml(i);
    box.appendChild(d);
  }
  $('bestScoreDisp').textContent=getBest();
  updateForceLandscape();
  const deco=$('bgDeco');
  const em=['🐱','🐶','🐰','🐼','🐸','🦊','🐯','🦁'];
  for(let i=0;i<8;i++){
    const s=document.createElement('span');
    s.textContent=em[i]; s.style.left=(Math.random()*100)+'%';
    s.style.animationDuration=(10+Math.random()*10)+'s';
    s.style.animationDelay=(Math.random()*8)+'s';
    deco.appendChild(s);
  }
})();

window.__LLK__ = {
  canConnect, buildBoard, findAnyMove, clearLine, lineReachable, dir,
  applyGravity, countTiles, shuffleRemaining, LEVELS, COLS, ROWS,
  getState:()=>state,
  setBoard:(b)=>{ state.board=b; },
  setState:(patch)=>Object.assign(state,patch),
  startGame, startLevel, petIconHtml, PET_ICONS, PET_NAMES,
  ensureMovesOrGameOver, updateForceLandscape, enterLandscapeMode, isTouchDevice
};
})();
</script>
